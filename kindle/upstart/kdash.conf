# Upstart: inicia o ciclo do painel no boot (instalar em /etc/upstart/kdash.conf;
# o / é somente leitura, ver instalar.sh). A lógica fica em /mnt/us/kdash, pra
# atualizar sem mexer no sistema.
# Pra não iniciar: criar /mnt/us/DESLIGAR_PAINEL (KUAL → Painel Casa → Parar).

description "Painel Casa (kindle-dash)"

start on started framework
stop on stopping framework

script
    [ -f /mnt/us/DESLIGAR_PAINEL ] && exit 0
    [ -x /mnt/us/kdash/sono.sh ] || exit 0
    # espera a interface da Amazon terminar de subir
    i=0
    while [ $i -lt 90 ]; do
        lipc-get-prop -s com.lab126.appmgrd activeApp >/dev/null 2>&1 && break
        sleep 1; i=$((i + 1))
    done
    sleep 15
    exec /mnt/us/kdash/sono.sh
end script
